<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071326"/>
      <stop offset="50%" stop-color="#0b1e3d"/>
      <stop offset="100%" stop-color="#07101e"/>
    </linearGradient>

    <!-- Tiger Fur Gradients -->
    <linearGradient id="tigerFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="creamFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff1e6"/>
    </linearGradient>

    <!-- Dynamic Swoosh Gradients -->
    <linearGradient id="swooshBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="swooshOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Laptop Gradients -->
    <linearGradient id="laptopShell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Gold Arrow Gradient -->
    <linearGradient id="goldGrowth" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Back Orbit Ring (Blue) -->
  <path d="M 85 365 C 55 270, 140 190, 275 180 C 390 170, 460 215, 465 285" 
        fill="none" stroke="url(#swooshBlue)" stroke-width="20" stroke-linecap="round" opacity="0.9"/>

  <!-- ==================== SHERU MASCOT ==================== -->
  <g id="sheru-mascot" filter="url(#softShadow)">
    
    <!-- Striped Tail -->
    <path d="M 125 310 C 95 240, 110 150, 145 135 C 168 125, 178 155, 155 185 C 135 210, 138 270, 152 320" 
          fill="url(#tigerFur)" stroke="#0f172a" stroke-width="3"/>
    <!-- Tail Stripes -->
    <path d="M 112 260 C 122 250, 140 265, 145 275" stroke="#1e1b18" stroke-width="9" stroke-linecap="round"/>
    <path d="M 118 215 C 130 205, 146 220, 153 230" stroke="#1e1b18" stroke-width="9" stroke-linecap="round"/>
    <path d="M 134 165 C 145 155, 162 165, 166 178" stroke="#1e1b18" stroke-width="8" stroke-linecap="round"/>
    <path d="M 144 136 C 150 133, 156 138, 150 146" fill="#1e1b18"/>

    <!-- Tiger Body / Navy Shirt -->
    <path d="M 155 350 C 165 305, 205 295, 256 295 C 307 295, 347 305, 357 350 L 375 425 L 137 425 Z" 
          fill="#172554"/>
    <!-- Shirt Collar & Button Placket -->
    <path d="M 232 295 L 256 345 L 280 295" fill="none" stroke="#1e3a8a" stroke-width="4"/>
    <polygon points="256,310 240,296 256,293" fill="#1e40af"/>
    <polygon points="256,310 272,296 256,293" fill="#1e40af"/>

    <!-- Left Ear -->
    <path d="M 172 135 C 160 85, 195 55, 218 80 C 210 105, 195 125, 172 135 Z" fill="#1e1b18"/>
    <path d="M 178 130 C 170 92, 198 68, 214 86 C 205 106, 195 120, 178 130 Z" fill="url(#tigerFur)"/>
    <path d="M 186 122 C 180 98, 200 80, 208 94 C 200 108, 195 116, 186 122 Z" fill="#fecdd3" opacity="0.8"/>

    <!-- Right Ear -->
    <path d="M 340 135 C 352 85, 317 55, 294 80 C 302 105, 317 125, 340 135 Z" fill="#1e1b18"/>
    <path d="M 334 130 C 342 92, 314 68, 298 86 C 307 106, 317 120, 334 130 Z" fill="url(#tigerFur)"/>
    <path d="M 326 122 C 332 98, 312 80, 304 94 C 312 108, 317 116, 326 122 Z" fill="#fecdd3" opacity="0.8"/>

    <!-- Head Base (Orange Fur) -->
    <path d="M 180 145 C 160 185, 172 235, 215 252 C 235 260, 277 260, 297 252 C 340 235, 352 185, 332 145 C 315 95, 197 95, 180 145 Z" 
          fill="url(#tigerFur)"/>

    <!-- Tiger Crown Stripes (Forehead) -->
    <path d="M 256 98 L 256 125" stroke="#1e1b18" stroke-width="7" stroke-linecap="round"/>
    <path d="M 244 104 C 248 114, 252 122, 256 125" stroke="#1e1b18" stroke-width="5" stroke-linecap="round"/>
    <path d="M 268 104 C 264 114, 260 122, 256 125" stroke="#1e1b18" stroke-width="5" stroke-linecap="round"/>
    <path d="M 235 116 C 243 124, 250 130, 256 132" stroke="#1e1b18" stroke-width="5" stroke-linecap="round"/>
    <path d="M 277 116 C 269 124, 262 130, 256 132" stroke="#1e1b18" stroke-width="5" stroke-linecap="round"/>

    <!-- Side Cheek Fur & Muzzle (Cream/White Fur) -->
    <path d="M 182 195 C 170 205, 175 225, 190 232 C 182 238, 192 250, 210 252 C 230 262, 282 262, 302 252 C 320 250, 330 238, 322 232 C 337 225, 342 205, 330 195 C 318 185, 305 190, 295 198 C 280 188, 232 188, 217 198 C 207 190, 194 185, 182 195 Z" 
          fill="url(#creamFur)"/>

    <!-- Cheek Tiger Stripes -->
    <path d="M 175 178 C 188 180, 202 185, 208 192" stroke="#1e1b18" stroke-width="6" stroke-linecap="round"/>
    <path d="M 172 196 C 184 198, 196 204, 202 210" stroke="#1e1b18" stroke-width="5" stroke-linecap="round"/>
    <path d="M 337 178 C 324 180, 310 185, 304 192" stroke="#1e1b18" stroke-width="6" stroke-linecap="round"/>
    <path d="M 340 196 C 328 198, 316 204, 310 210" stroke="#1e1b18" stroke-width="5" stroke-linecap="round"/>

    <!-- Friendly Eyes Behind Glasses -->
    <!-- Left Eye -->
    <ellipse cx="224" cy="162" rx="14" ry="16" fill="#ffffff"/>
    <ellipse cx="225" cy="162" rx="10" ry="12" fill="#78350f"/>
    <ellipse cx="226" cy="162" rx="6" ry="8" fill="#0f172a"/>
    <circle cx="228" cy="158" r="3.5" fill="#ffffff"/>
    <circle cx="223" cy="165" r="1.5" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="288" cy="162" rx="14" ry="16" fill="#ffffff"/>
    <ellipse cx="287" cy="162" rx="10" ry="12" fill="#78350f"/>
    <ellipse cx="286" cy="162" rx="6" ry="8" fill="#0f172a"/>
    <circle cx="288" cy="158" r="3.5" fill="#ffffff"/>
    <circle cx="283" cy="165" r="1.5" fill="#ffffff"/>

    <!-- Glasses Frame (Signature Smart Glasses) -->
    <!-- Left Lens Rim -->
    <rect x="198" y="140" width="52" height="44" rx="13" fill="none" stroke="#0f172a" stroke-width="6.5"/>
    <rect x="200" y="142" width="48" height="40" rx="11" fill="#38bdf8" fill-opacity="0.12"/>
    <!-- Right Lens Rim -->
    <rect x="262" y="140" width="52" height="44" rx="13" fill="none" stroke="#0f172a" stroke-width="6.5"/>
    <rect x="264" y="142" width="48" height="40" rx="11" fill="#38bdf8" fill-opacity="0.12"/>
    <!-- Glasses Bridge & Temples -->
    <path d="M 250 158 C 255 154, 257 154, 262 158" fill="none" stroke="#0f172a" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 198 152 L 180 148" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <path d="M 314 152 L 332 148" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>

    <!-- Cute Tiger Nose & Smile -->
    <path d="M 248 205 C 250 202, 262 202, 264 205 C 267 210, 258 217, 256 218 C 254 217, 245 210, 248 205 Z" 
          fill="#1e1b18"/>
    <path d="M 256 218 L 256 226" stroke="#1e1b18" stroke-width="3"/>
    <path d="M 242 225 C 248 232, 256 230, 256 226 C 256 230, 264 232, 270 225" 
          fill="none" stroke="#1e1b18" stroke-width="3" stroke-linecap="round"/>

    <!-- Thoughtful Paw on Chin -->
    <path d="M 264 285 C 260 268, 275 255, 290 260 C 302 265, 302 282, 292 292 C 285 298, 272 295, 264 285 Z" 
          fill="url(#tigerFur)" stroke="#0f172a" stroke-width="3"/>
    <!-- Paw Toe Separation & Stripes -->
    <path d="M 276 260 C 278 268, 282 274, 282 280" stroke="#1e1b18" stroke-width="3"/>
    <path d="M 288 262 C 290 270, 292 276, 290 282" stroke="#1e1b18" stroke-width="3"/>
  </g>

  <!-- ==================== FINANCIAL DASHBOARD LAPTOP ==================== -->
  <g id="laptop-dashboard" filter="url(#softShadow)">
    <!-- Laptop Screen Shell (Tilted Angle) -->
    <polygon points="245,395 385,295 440,325 305,430" fill="url(#laptopShell)" stroke="#334155" stroke-width="3"/>
    <!-- Glowing Screen Display -->
    <polygon points="252,392 380,302 430,328 308,422" fill="url(#screenGrad)"/>

    <!-- Screen UI Elements: Financial Growth Charts -->
    <!-- Pie Chart Graphic -->
    <ellipse cx="325" cy="342" rx="16" ry="12" fill="#0284c7"/>
    <path d="M 325 342 L 338 335 A 16 12 0 0 0 325 330 Z" fill="#f97316"/>

    <!-- Bar Chart -->
    <rect x="352" y="348" width="6" height="12" rx="1" fill="#38bdf8" transform="skewY(-15)"/>
    <rect x="364" y="340" width="6" height="18" rx="1" fill="#60a5fa" transform="skewY(-15)"/>
    <rect x="376" y="330" width="6" height="26" rx="1" fill="#f97316" transform="skewY(-15)"/>
    <rect x="388" y="320" width="6" height="34" rx="1" fill="#fbbf24" transform="skewY(-15)"/>

    <!-- Upward Trend Line & Arrow -->
    <path d="M 345 365 Q 370 340, 405 315" fill="none" stroke="url(#goldGrowth)" stroke-width="4" stroke-linecap="round"/>
    <polygon points="405,310 412,320 400,320" fill="#fbbf24"/>

    <!-- Laptop Base / Keyboard deck -->
    <polygon points="205,405 248,395 315,430 260,438" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <polygon points="220,406 250,398 300,425 265,432" fill="#1e293b"/>
  </g>

  <!-- Front Dynamic Orbit Ring (Orange Swirl) -->
  <path d="M 105 375 C 130 425, 230 445, 330 415 C 420 390, 475 330, 455 285 C 445 265, 420 255, 395 265" 
        fill="none" stroke="url(#swooshOrange)" stroke-width="16" stroke-linecap="round"/>
  <!-- Orbiting Star / Energy Node -->
  <circle cx="458" cy="288" r="7" fill="#ffffff" filter="url(#softShadow)"/>
  <circle cx="458" cy="288" r="4" fill="#fbbf24"/>
</svg>
